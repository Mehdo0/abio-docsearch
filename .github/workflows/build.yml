name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Tests et exécutables Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Exécutable graphique
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AbionicDocSearch `
            --icon docsearch/ui/assets/favicon.ico `
            --version-file packaging/version_info.txt `
            --add-data "docsearch/ui;docsearch/ui" `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import webview.platforms.winforms `
            --hidden-import pythoncom `
            --hidden-import win32com.client `
            --hidden-import win32timezone `
            --hidden-import docsearch.selftest `
            --collect-submodules win32com `
            --collect-all webview `
            launcher_gui.py

      - name: Exécutable ligne de commande
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name abio-docsearch-cli `
            --version-file packaging/version_info.txt `
            --hidden-import docsearch.selftest `
            launcher_cli.py

      - name: Auto-test des exécutables
        run: |
          & dist\abio-docsearch-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "auto-test de la CLI en échec" }
          $process = Start-Process -FilePath dist\AbionicDocSearch.exe `
            -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "auto-test de l'interface en échec" }
          Write-Host "Auto-test des deux exécutables : OK"

      - name: Paquet de distribution
        run: |
          New-Item -ItemType Directory -Force dist\app | Out-Null
          Copy-Item dist\AbionicDocSearch.exe dist\app\
          Copy-Item packaging\LISEZMOI.txt dist\app\
          Compress-Archive -Path dist\app\* -DestinationPath dist\AbionicDocSearch-windows.zip -Force

          New-Item -ItemType Directory -Force dist\cli | Out-Null
          Copy-Item dist\abio-docsearch-cli.exe dist\cli\
          Copy-Item packaging\LISEZMOI.txt dist\cli\
          Compress-Archive -Path dist\cli\* -DestinationPath dist\abio-docsearch-cli-windows.zip -Force

          Get-FileHash dist\AbionicDocSearch-windows.zip, dist\abio-docsearch-cli-windows.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AbionicDocSearch-windows
          path: |
            dist/AbionicDocSearch-windows.zip
            dist/abio-docsearch-cli-windows.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AbionicDocSearch-windows.zip
            dist/abio-docsearch-cli-windows.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Application de bureau **Abionic DocSearch**.

            Télécharge `AbionicDocSearch-windows.zip`, décompresse-le où tu veux,
            puis double-clique `AbionicDocSearch.exe`. Aucun droit administrateur,
            aucune installation.

            La ligne de commande reste disponible séparément :
            `abio-docsearch-cli-windows.zip`.
